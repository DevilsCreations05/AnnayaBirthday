<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Happy Birthday ✦</title>
  <meta name="theme-color" content="#120c08" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,500;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ambient layers -->
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- custom cursor -->
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <!-- INTRO -->
  <section id="intro" class="intro">
    <div class="intro-inner">
      <p class="intro-eyebrow"><span class="ln"></span><span>A little surprise</span><span class="ln"></span></p>
      <h1 class="intro-title">
        <span class="script write">Happy</span>
        <span class="serif rise">Birthday</span>
      </h1>
      <p class="intro-name" id="introName"></p>

      <div class="loader" id="loader">
        <div class="loader-track"><div class="loader-fill" id="loaderFill"></div></div>
        <p class="loader-text"><span id="loaderCount">0</span> / <span id="loaderTotal">0</span> memories loaded</p>
      </div>

      <button class="btn-start magnetic" id="startBtn" disabled>
        <span class="btn-label">Open the surprise</span>
        <span class="btn-star">✦</span>
      </button>
      <p class="intro-hint">Best viewed full-screen · ← → to navigate · Space to pause</p>
    </div>
  </section>

  <!-- SLIDER -->
  <main id="stage" class="stage" aria-roledescription="carousel" aria-label="Birthday memories">
    <div id="slides" class="slides"></div>

    <!-- transition overlays -->
    <div class="shutter" id="shutter" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="leak" id="leak" aria-hidden="true"></div>

    <!-- UI -->
    <div class="ui">
      <div class="segments" id="segments"></div>

      <div class="ui-bottom">
        <div class="counter" aria-live="polite">
          <span class="roll"><span class="roll-inner" id="rollCur"></span></span>
          <span class="sep"></span>
          <span class="total" id="countTotal">00</span>
        </div>

        <div class="controls">
          <button class="ctl magnetic" id="prevBtn" aria-label="Previous">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="ctl magnetic" id="playBtn" aria-label="Pause">
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
          </button>
          <button class="ctl magnetic" id="nextBtn" aria-label="Next">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <button class="ctl magnetic" id="fsBtn" aria-label="Toggle full screen">
            <svg class="i-enter" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            <svg class="i-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
